<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title"><title id="title">Defendly — Every CV line. A learning opportunity.</title><defs><linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".6" stop-color="#ff69c8"/><stop offset="1" stop-color="#ffe46b"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.orbit{animation:orbit 20s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:500;animation:draw 8s ease-in-out infinite}.flow{stroke-dasharray:5 13;animation:flow 6s linear infinite}.slide{animation:slide 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes slide{0%,15%,100%{transform:translateX(0)}50%,70%{transform:translateX(64px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.draw,.flow,.slide{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="998" height="393" rx="22" fill="#070b18" stroke="#26374f"/><text x="38" y="38" font-size="11" fill="#ff69c8" font-weight="700">AI APPLICATION / INTERVIEW PRACTICE</text><text x="38" y="100" font-size="55" fill="#eff5ff" font-weight="700">Defendly</text><text x="38" y="149" font-size="24" fill="#ff69c8" font-weight="400">Every CV line.</text><text x="38" y="180" font-size="24" fill="#ff69c8" font-weight="400">A learning opportunity.</text><g transform="translate(650 55) scale(1)"><rect x="5" y="22" width="98" height="179" rx="12" fill="#10192c" stroke="#ff69c8"/><text x="21" y="56" font-size="22" fill="#ff69c8" font-weight="700">CV</text><path d="M21 81L86 81" fill="none" stroke="#26374f" stroke-width="3" class=""/><path d="M21 101L72 101" fill="none" stroke="#26374f" stroke-width="3" class=""/><path d="M21 121L81 121" fill="none" stroke="#26374f" stroke-width="3" class=""/><path d="M21 141L61 141" fill="none" stroke="#26374f" stroke-width="3" class=""/><path d="M21 161L77 161" fill="none" stroke="#26374f" stroke-width="3" class=""/><path d="M108 110L164 110" fill="none" stroke="#ffe46b" stroke-width="2" class="flow"/><rect x="177" y="27" width="124" height="68" rx="12" fill="#201027" stroke="#ff69c8"/><rect x="154" y="125" width="147" height="68" rx="12" fill="#070b18" stroke="#ff69c8"/><path d="M190 49h95" fill="none" stroke="#ff69c8" stroke-width="3" class="draw"/><path d="M190 69h70" fill="none" stroke="#ff69c8" stroke-width="3" class="draw"/><path d="M168 147h112" fill="none" stroke="#ff69c8" stroke-width="3" class="draw"/><path d="M168 168h81" fill="none" stroke="#ff69c8" stroke-width="3" class="draw"/><text x="55" y="253" font-size="10" fill="#aabbd5" font-weight="400">CONCEPT ANIMATION</text></g><rect x="38" y="375" width="924" height="2" rx="1" fill="url(#spectrum)" stroke="none"/><text x="38" y="350" font-size="11" fill="#aabbd5" font-weight="700">BUILD / EXPERIMENT / EXPLAIN</text></svg>