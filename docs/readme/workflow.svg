<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title"><title id="title">Extract: CV evidence and skills / Practice: Targeted interview questions / Adapt: Answer evaluation and mastery</title><defs><linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".6" stop-color="#ff69c8"/><stop offset="1" stop-color="#ffe46b"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.orbit{animation:orbit 20s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:500;animation:draw 8s ease-in-out infinite}.flow{stroke-dasharray:5 13;animation:flow 6s linear infinite}.slide{animation:slide 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes slide{0%,15%,100%{transform:translateX(0)}50%,70%{transform:translateX(64px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.draw,.flow,.slide{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="998" height="208" rx="22" fill="#070b18" stroke="#26374f"/><text x="28" y="35" font-size="12" fill="#ff69c8" font-weight="700">A CLOSER LOOK</text><rect x="28" y="56" width="296" height="126" rx="10" fill="#0e1729" stroke="#26374f"/><text x="45" y="84" font-size="12" fill="#438cff" font-weight="700">01</text><text x="45" y="120" font-size="23" fill="#eff5ff" font-weight="700">Extract</text><text x="45" y="154" font-size="15" fill="#aabbd5" font-weight="400">CV evidence and skills</text><rect x="352" y="56" width="296" height="126" rx="10" fill="#0e1729" stroke="#26374f"/><text x="369" y="84" font-size="12" fill="#ff69c8" font-weight="700">02</text><text x="369" y="120" font-size="23" fill="#eff5ff" font-weight="700">Practice</text><text x="369" y="154" font-size="15