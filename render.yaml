services:
  - type: web
    name: defendly-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_ENABLED
        value: "false"
      - key: DEFAULT_LLM_PROVIDER
        value: openai
      - key: DATABASE_PATH
        value: /var/data/interview_agent.db
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: defendly-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: defendly-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: defendly-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: defendly-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
